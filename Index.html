<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Absensi Karyawan</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdf8f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: bold;
      color: #1d3557;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(29, 53, 87, 0.1);
      border-top-color: #1d3557;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Animation -->
  <div id="loading">
    <div class="spinner"></div>
    <div>Memuat Aplikasi Absensi...</div>
  </div>

  <!-- Fullscreen Iframe -->
  <iframe id="app-iframe" src="" allow="geolocation; microphone; camera; midi; encrypted-media;"></iframe>

  <script>
    (function() {
      // =========================================================================
      // 1. PENTING: Ganti URL di bawah ini dengan URL Web App Anda yang di-deploy
      // =========================================================================
      var webAppUrl = "https://script.google.com/macros/s/AKfycby4pWr2Y-BFwIhzZ1-FZPLA3fe6okmwYtn4J4qrQTFkOBCZItQ9los6x0NvPs_DccD7/exec";
      
      // 2. Deteksi otomatis lebar layar HP (lebar < 768px atau User Agent mobile)
      var isMobile = window.innerWidth < 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      // 3. Tambahkan parameter mode=mobile jika dibuka lewat HP
      var targetUrl = webAppUrl;
      if (isMobile) {
        if (targetUrl.indexOf('?') !== -1) {
          targetUrl += "&mode=mobile";
        } else {
          targetUrl += "?mode=mobile";
        }
      }
      
      // 4. Set URL ke iframe
      var iframe = document.getElementById("app-iframe");
      if (iframe) {
        iframe.src = targetUrl;
        
        // Sembunyikan spinner ketika aplikasi selesai dimuat di dalam iframe
        iframe.onload = function() {
          var loader = document.getElementById("loading");
          if (loader) {
            loader.style.display = "none";
          }
        };
      }
    })();
  </script>
</body>
</html>
